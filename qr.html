<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>باركود حجز القاعات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{margin:0;font-family:Tahoma,Arial,sans-serif;text-align:center;color:#10213b;background:#fff;padding:24px}img{width:120px}h1{margin:10px 0 4px}#q{display:inline-block;padding:16px;border:3px solid #14407c;border-radius:16px;margin:18px 0}ol{display:inline-block;text-align:right;font-size:1.1rem;line-height:2}.u{direction:ltr;color:#5b6a82}button{padding:10px 24px;font:inherit;border:0;border-radius:8px;background:#14407c;color:#fff;cursor:pointer}@media print{button{display:none}}</style></head><body>
<img src="icons/icon-512.png" alt="">
<h1>حجز قاعات كلية الهندسة</h1><div>جامعة المنصورة</div>
<div id="q"></div>
<div><ol><li>امسح الباركود بكاميرا الموبايل</li><li>اختر صفتك والقاعة والموعد</li><li>احتفظ بكود الحجز وارفع الإثبات خلال 48 ساعة</li></ol></div>
<div class="u" id="u"></div><br><button onclick="window.print()">طباعة</button>
<script>var url=location.href.replace(/qr\.html.*$/,"");new QRCode(document.getElementById("q"),{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});document.getElementById("u").textContent=url;</script></body></html>
