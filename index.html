<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f2c52"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="قاعات الهندسة"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>حجز قاعات كلية الهندسة - المنصورة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f7;--sf:#fff;--ink:#10213b;--mute:#5b6a82;--line:#d8dee8;--brand:#14407c;--bi:#fff;--gold:#b6842a;--ok:#e1f2e8;--oki:#1b6a3d;--bad:#f3dfdf;--badi:#98302f;--amb:#fff0d2;--ambi:#8a5a00;--hero:#0f2c52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--sf:#16213a;--ink:#e8edf6;--mute:#9aa8c0;--line:#2a3855;--brand:#6fa3ee;--bi:#0d1526;--gold:#e0b25a;--ok:#173a2a;--oki:#7fd6a3;--bad:#3d2024;--badi:#f0a0a0;--amb:#3b2e10;--ambi:#f0c777;--hero:#0a1a33}}
:root[data-theme="dark"]{--bg:#0d1526;--sf:#16213a;--ink:#e8edf6;--mute:#9aa8c0;--line:#2a3855;--brand:#6fa3ee;--bi:#0d1526;--gold:#e0b25a;--ok:#173a2a;--oki:#7fd6a3;--bad:#3d2024;--badi:#f0a0a0;--amb:#3b2e10;--ambi:#f0c777;--hero:#0a1a33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--hero);color:#fff;padding:18px 16px 0}
.in{max-width:820px;margin:0 auto}
header h1{margin:0;font-size:1.45rem;font-weight:800}
header p{margin:2px 0 12px;color:#b9c8e0;font-size:.9rem}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1;min-width:92px;padding:10px 8px;border:0;border-radius:10px 10px 0 0;background:transparent;color:#b9c8e0;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:14px 16px 30px}
section,.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px}
h3{font-size:.95rem;margin:12px 0 6px}
.halls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hall{border:2px solid var(--line);background:var(--sf);color:var(--ink);border-radius:10px;padding:10px;font:inherit;text-align:right;cursor:pointer;font-weight:700}
.hall small{display:block;color:var(--mute);font-weight:500}
.hall.on{border-color:var(--brand);background:var(--bg)}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}
select,input[type=text],input[type=tel],input[type=date],input[type=password],input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.day{margin-top:6px;font-weight:800;color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{padding:8px 2px;border-radius:8px;border:0;font:inherit;font-size:.85rem;cursor:pointer;background:var(--ok);color:var(--oki)}
.slot.busy{background:var(--bad);color:var(--badi);cursor:not-allowed;text-decoration:line-through}
.slot.sel{background:var(--brand);color:var(--bi);font-weight:700}
.hint{color:var(--mute);font-size:.82rem;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tot{font-size:1.25rem;font-weight:800;color:var(--gold)}
.tot.fr{color:var(--oki)}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--bi);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.s{width:auto;margin:0;padding:7px 12px;font-size:.85rem}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:var(--badi);color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:8px;font-size:.9rem}
.msg.e{background:var(--bad);color:var(--badi)}
.msg.o{background:var(--ok);color:var(--oki)}
.msg.w{background:var(--amb);color:var(--ambi)}
.code{font-size:2rem;font-weight:800;letter-spacing:3px;text-align:center;direction:ltr;color:var(--brand);padding:10px;border:2px dashed var(--brand);border-radius:12px;margin:10px 0}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.bd.w,.bd.c{background:var(--amb);color:var(--ambi);border-color:transparent}
.bd.ok{background:var(--ok);color:var(--oki);border-color:transparent}
.bd.x,.bd.e{background:var(--bad);color:var(--badi);border-color:transparent}
.tl{list-style:none;margin:10px 0;padding:0}
.tl li{position:relative;padding:4px 30px 4px 0;color:var(--mute)}
.tl li:before{content:"";position:absolute;right:4px;top:11px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--sf)}
.tl li.dn{color:var(--ink);font-weight:700}
.tl li.dn:before{background:var(--oki);border-color:var(--oki)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.kp b{display:block;font-size:1.25rem}.kp span{font-size:.78rem;color:var(--mute)}
.bar{height:10px;border-radius:5px;background:var(--brand);margin-top:3px}
.sub{display:flex;gap:6px;margin-bottom:12px}
.sub button{flex:1;padding:8px;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.sub button.on{background:var(--brand);color:var(--bi);border-color:var(--brand)}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
img.pf{max-width:140px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hide{display:none}
ol,ul{padding-right:20px;margin:6px 0}
@media print{header,.sub,.btn,.tabs{display:none}}
</style>
</head>
